[project]
name = "ai-decision-arena"
version = "0.1.0"
description = "Multi-agent technical decision system (LangGraph + Claude + Tavily)"
authors = [
    { name = "fahadtariqaziz", email = "fahadtariqaziz1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-anthropic>=1.7.6",
    "langgraph>=1.2.16",
    "langsmith>=0.14.11",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
